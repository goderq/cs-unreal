; v2.0 phase 7: volumetric clouds by the Effects level. The engine draws them
; at full cost on every level. Measured on the owner's RTX 3050 Laptop (1080p,
; High, Depot, 8 bots, fixed benchmark view - docs/GRAPHICS.md):
;   clouds as shipped by the engine          53 FPS (GPU 18.2 ms)
;   no volumetric clouds                     62 FPS (GPU 15.5 ms)
;   128 view samples, no cloud AO or shadow  53 FPS - no gain, not used
; So Low and Medium go without them (the sky atmosphere stays); High and up keep
; them - written out, so going back up from Medium turns them on again.

[EffectsQuality@0]
r.VolumetricCloud=0

[EffectsQuality@1]
r.VolumetricCloud=0

[EffectsQuality@2]
r.VolumetricCloud=1

[EffectsQuality@3]
r.VolumetricCloud=1

[EffectsQuality@Cine]
r.VolumetricCloud=1
