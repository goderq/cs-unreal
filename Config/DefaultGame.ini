; ---------------------------------------------------------------------------
; Photon Fusion 3 settings.
;
; Section name verified against the SDK: UFusionOnlineSubsystemSettings is
; declared UCLASS(config = Game, defaultconfig, DisplayName = "Fusion Settings"),
; so it reads from DefaultGame.ini - NOT DefaultEngine.ini.
;
; Editable in the editor at Project Settings > Plugins > Fusion Settings.
;
; DefaultArraySize caps every replicated TArray that does not carry a
; FusionArraySize meta tag. Fusion pre-allocates array capacity and hard-caps
; it at 64 elements, which is what sizes the inventory in Stage 3.
; ---------------------------------------------------------------------------
[/Script/PhotonFusion.FusionOnlineSubsystemSettings]
AppId=e871d2ff-75f2-47c9-8f0d-35e3a847ff92
; v2.0 changed the wire protocol (match tickets, RPC signatures): old and new
; builds must never share a room. Package_release.ps1 stamps the release number.
AppVersion=2.0.0-dev.2
MinPlayers=1
MaxPlayers=8
UseLocalServer=False
LoadMapAutomatically=True
DefaultArraySize=16

