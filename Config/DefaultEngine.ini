GameDefaultMap=/Game/Maps/Lvl_MainMenu.Lvl_MainMenu
EditorStartupMap=/Game/Maps/Lvl_Warehouse.Lvl_Warehouse
GlobalDefaultGameMode=/Game/Characters/BP_CSGameMode.BP_CSGameMode_C
GameInstanceClass=/Script/CSFusion.CSGameInstance

[/Script/Engine.Engine]
; v1.1: first-person weapons come close to the eye when aiming; the default 10 cm cut into them.
NearClipPlane=4.0
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/CSFusion")
; v2.0 phase 5: upscaler, render resolution and ray tracing saved next to the
; engine's graphics settings (Source/CSFusion/Settings/CSGameUserSettings.h).
GameUserSettingsClassName=/Script/CSFusion.CSGameUserSettings

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; v2.0 phase 5 (AUDIT B14, K6): Shader Model 6 only - hardware ray tracing
; needs it, and building SM5 as well would double the shaders.
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
; v2.0 phase 5: TSR by default (was TAA); DLSS where the plugin is installed
; and the GPU supports it (Source/CSFusion/Graphics/CSGraphics.h).
r.AntiAliasingMethod=4
r.Shadow.Virtual.Enable=1
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; v2.0 phase 5: hardware ray tracing compiled in and switched at runtime
; (r.RayTracing.EnableOnDemand, on by default): off unless the GPU allows it
; and the player turns it on; Lumen then traces in hardware.
r.RayTracing=True
; Software Lumen (every PC without hardware ray tracing, and with it switched
; off) traces mesh distance fields. They were never built (the engine default
; is off), so Lumen GI and reflections had nothing to trace since v1.1 - the
; "flat light" of AUDIT section 7. Found by the phase 5 graphics self-test.
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=False

[/Script/Engine.PhysicsSettings]
DefaultDegreesOfFreedom=Full3D
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=4
; Surface types for footsteps and impacts (v2.0 phase 3). Must match CSSurface
; in Source/CSFusion/Audio/CSAudio.h and Scripts/bootstrap_phase3_audio.py.
+PhysicalSurfaces=(Type=SurfaceType1,Name="Metal")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Wood")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Dirt")

[/Script/Engine.CollisionProfile]
; Sound occlusion traces (ATT_* assets). Walls and props block it; player
; capsules and ragdolls ignore it, so a sound is not muffled by its own source
; or by the listener's own body. Must match CSCollision::AudioOcclusion.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="AudioOcclusion")

